; =============================================================================
;  RC_FPV_SCALER_PRO :: ESP32-CAM (AI-Thinker, OV2640) firmware
; -----------------------------------------------------------------------------
;  Build:   pio run -e esp32cam
;  Flash:   pio run -e esp32cam -t upload --upload-port /dev/cu.usbserial-XXXX
;  Monitor: pio device monitor -b 115200
;
;  Notes:
;   * board "esp32cam" enables PSRAM, which we rely on for double buffering.
;   * huge_app partition gives the camera app maximum flash (no OTA needed).
;   * The Adafruit MPU6050 libs are only *compiled in* when ENABLE_MPU6050=1
;     in include/config.h; they are listed here so the optional path builds
;     without any manual lib install. They add no runtime cost when disabled.
; =============================================================================
[env:esp32cam]
platform        = espressif32
board           = esp32cam
framework       = arduino
monitor_speed   = 115200
; AI-Thinker + USB-TTL adapters are far more reliable flashing at 115200; bump
; back to 921600 only if your adapter is solid.
upload_speed    = 115200
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -Wall

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ---------------------------------------------------------------------------
; Dual-USB-C ESP32-S3-CAM, common ESP32-S3-WROOM-1 N16R8 variant.
; IMPORTANT: GPIO mapping / 16MB flash / 8MB OPI PSRAM require hardware check.
; Protocol v2, AP credentials, and receiver firmware are shared with esp32cam.
; ---------------------------------------------------------------------------
[env:esp32s3cam_n16r8]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 460800
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DFPV_BOARD_ESP32S3_CAM=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Wall

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
