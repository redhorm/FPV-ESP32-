; =============================================================================
;  RC_FPV_SCALER_PRO :: ESP32-S3 receiver (ST7789 240x240) firmware
; -----------------------------------------------------------------------------
;  Build:   pio run -e receiver_s3
;  Flash:   pio run -e receiver_s3 -t upload --upload-port /dev/cu.usbmodemXXXX
;  Monitor: pio device monitor -b 115200
;
;  Library choice: LovyanGFX (display + built-in JPEG decoder). Pins are set in
;  code (src/jpeg_renderer.cpp) so NO global library file needs editing.
;
;  PSRAM: the overlay uses sprites and prefers PSRAM. memory_type qio_opi suits
;  the common N16R8 (octal PSRAM) DevKitC-1. If your board has NO PSRAM the
;  firmware still runs - the overlay allocates sprites in internal RAM and, if
;  even that fails, degrades gracefully (see ui_overlay.cpp).
; =============================================================================
[env:receiver_s3]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600

; Native USB CDC for Serial over the S3's USB port.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DCORE_DEBUG_LEVEL=0
    -Wall

; Octal PSRAM for N16R8 boards. If you have an N8 (no PSRAM) board, you may
; remove this line and -DBOARD_HAS_PSRAM above.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
